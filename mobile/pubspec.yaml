name: gebzem
description: "Gebzem - mesajlasma, arama, sesli oda ve canli yayin uygulamasi"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # ⚠️⚠️ TURU 80 — YERELLESTIRME. Bu paket OLMADAN `showDatePicker` ve
  #    `showTimePicker` **INGILIZCE** aciliyordu ("August", "Mon", "AM/PM").
  #    Etkinlik olusturma ve isletme calisma saatleri ekranlari bunlari
  #    KULLANIYOR — yani hata SAHADAYDI ve turu 80 denetiminde yakalandi.
  #    ⚠️ Flutter SDK'nin KENDI paketi: pub bagimliligi ve NATIVE KOD YOK,
  #       derleme riski tasimaz (sentry 8.x / firebase dersleri burada gecerli
  #       degil).
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Durum yonetimi
  flutter_riverpod: ^2.6.1
  # Navigasyon
  go_router: ^14.8.1
  # HTTP istemcisi
  dio: ^5.8.0
  # WebSocket (gercek zamanli mesajlasma)
  web_socket_channel: ^3.0.2
  # Token guvenli saklama
  flutter_secure_storage: ^9.2.4
  # Tarih/saat bicimlendirme
  intl: ^0.20.2
  # Push bildirimleri
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  # Hata telemetrisi (Sentry)
  sentry_flutter: ^9.6.0
  sentry_dio: ^9.6.0
  lucide_icons_flutter: ^3.1.15
  livekit_client: ^2.8.1
  # Kamera cevirme (on/arka) icin Helper.switchCamera — livekit ile AYNI surum (cakisma olmasin)
  flutter_webrtc: 1.4.0
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  # Arama sesleri: zil (gelen) + calma tonu (giden). flutter_ringtone_player KULLANMA —
  # iOS'ta dongu yok, stop() calismiyor.
  audioplayers: ^6.5.0
  vibration: ^3.1.3
  # Kilit ekraninda/uygulama kapaliyken gelen arama (iOS CallKit + Android full-screen intent)
  flutter_callkit_incoming: ^3.1.3
  battery_plus: ^7.1.1

  # ⚠️⚠️ TURU 74 — MEDYA MESAJLASMA (arastirma: docs/medya-arastirma/kesif-flutter-paketler.md)
  # Galeri/kamera secici. ⚠️ `camera` paketi EKLENMEDI: iOS'ta flutter_webrtc TEK
  # PAYLASILAN `videoCapturer` tutuyor (turu 50'de iki capture oturumu birbirini
  # oldurmustu). Sistem picker'i AYRI SUREC oldugu icin bu catismayi yasamaz.
  image_picker: ^1.2.3
  # Sikistirma + EXIF temizleme (platform API, saf Dart 'image' paketinden ~10x hizli)
  flutter_image_compress: ^2.5.1
  # Gecici dosya dizinleri (sikistirma cikti yolu, indirme onbellegi)
  path_provider: ^2.1.6
  # MD5/SHA-256 — yukleme butunlugu (Content-MD5 imzaya dahil) + dedup
  crypto: ^3.0.6
  # Uzak gorsel onbellegi. ⚠️ Bizde URL KISA OMURLU (600sn imzali) oldugu icin
  # onbellek anahtari URL DEGIL `media_id` olmali — bkz. medya_servisi.dart.
  cached_network_image: ^3.4.1
  # Ses notu kaydi. ⚠️ Yeni IZIN GEREKMEZ: RECORD_AUDIO (AndroidManifest) ve
  # NSMicrophoneUsageDescription (Info.plist) arama icin ZATEN var.
  record: ^7.1.1

  # TURU 75 — GONDERI/REELS VIDEO OYNATICI.
  # !! iOS TUZAGI: video_player varsayilan olarak AVAudioSession kategorisini
  #    .playback yapar ve DIGER sesi KESER -> suren LiveKit aramasinin sesi olur.
  #    Bu yuzden HER oynatici VideoPlayerOptions(mixWithOthers: true) ile kurulur
  #    ve arama/oda/yayin canliyken ses ZORLA kapatilir (bkz. sosyal/medya_video.dart).
  video_player: ^2.9.2

  # TURU 76 — sohbet listesinde KAYDIRMA aksiyonlari (sil/arsivle/sabitle).
  # Uygulamada daha once HICBIR swipe widget'i yoktu (Dismissible/Slidable 0 kullanim).
  # !! Dismissible YERINE flutter_slidable: Dismissible ogeyi AGACTAN SILER ve
  #    "arsivle" gibi GERI ALINABILIR islemlerde satiri geri getirmek icin ek
  #    durum yonetimi gerektirir; Slidable panel acar, satir yerinde kalir.
  flutter_slidable: ^4.0.3

  # TURU 81 — KONUM PAYLASMA.
  # ⚠️ `location` mesaj tipi DB CHECK'inde ve sunucu beyaz listesinde ZATEN
  #    kabul ediliyordu, sohbet listesi onizlemesi bile "Konum" cizyordu —
  #    ama konum ALAN hicbir paket ve GONDEREN hicbir yol yoktu ("olu ozellik"
  #    sinifinin SEKIZINCI ornegi).
  # ⚠️ IZIN `permission_handler` ile isteniyor (geolocator'in kendi izin API'si
  #    DEGIL): kod tabaninin geri kalani (mikrofon, kamera, telefon) o paketi
  #    kullaniyor ve iki izin katmani tutmak kacinilmaz olarak DRIFT ederdi.
  geolocator: ^13.0.2

  # ⚠️ HARITA SDK'si (google_maps_flutter) BILINCLI OLARAK EKLENMEDI:
  #    (a) CLAUDE.md "cloudMapId KULLANMA" diyor (bedava kalmasi icin),
  #    (b) API anahtari + faturalandirma + iki platformda ek kurulum ister,
  #    (c) sohbette bir konumu GOSTERMEK icin gereken sey harita degil,
  #        KOORDINAT + "Haritada ac" baglantisidir. Kullanicinin telefonunda
  #        zaten bir harita uygulamasi var ve yol tarifi orada calisir.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Uygulama ikonu uretimi (calisma zamaninda kullanilmaz):
  # tool/ikon_uret.dart kaynak gorseli kirpar -> dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4
  image: ^4.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/sounds/

  # TEST TURU 58 — UYGULAMA YAZI TIPI: GOOGLE SANS (kullanici istegi).
  # NOT: Google Sans uzun sure yalniz Google urunlerine ozeldi; ARTIK Google Fonts'ta
  # halka acik (fonts.google.com/specimen/Google+Sans). Dosyalar resmi Google Fonts
  # API'sinden (fonts.gstatic.com) alindi.
  # ⚠️ YAPMA: bu dosyalari elle/baska kaynaktan degistirme; guncelleme gerekirse
  # `https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700`
  # cikitisindaki gstatic adreslerinden yeniden indir.
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-400.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-500.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-600.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-700.ttf
          weight: 700

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# UYGULAMA IKONU (dart run flutter_launcher_icons)
# Kaynak: assets/icon/kaynak.jpg (kullanici tasarimi, mor kivrimli logo)
# tool/ikon_uret.dart once kirpilmis icon.png + adaptive-fg.png uretir.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon-adaptive-fg.png"
