name: gebzem
description: "Gebzem - mesajlasma, arama, sesli oda ve canli yayin uygulamasi"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # ⚠️⚠️ TURU 80 — YERELLESTIRME. Bu paket OLMADAN `showDatePicker` ve
  #    `showTimePicker` **INGILIZCE** aciliyordu ("August", "Mon", "AM/PM").
  #    Etkinlik olusturma ve isletme calisma saatleri ekranlari bunlari
  #    KULLANIYOR — yani hata SAHADAYDI ve turu 80 denetiminde yakalandi.
  #    ⚠️ Flutter SDK'nin KENDI paketi: pub bagimliligi ve NATIVE KOD YOK,
  #       derleme riski tasimaz (sentry 8.x / firebase dersleri burada gecerli
  #       degil).
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Durum yonetimi
  flutter_riverpod: ^2.6.1
  # Navigasyon
  go_router: ^14.8.1
  # HTTP istemcisi
  dio: ^5.8.0
  # WebSocket (gercek zamanli mesajlasma)
  web_socket_channel: ^3.0.2
  # Token guvenli saklama
  flutter_secure_storage: ^9.2.4
  # Tarih/saat bicimlendirme
  intl: ^0.20.2
  # Push bildirimleri
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  # Hata telemetrisi (Sentry)
  sentry_flutter: ^9.6.0
  sentry_dio: ^9.6.0
  lucide_icons_flutter: ^3.1.15
  livekit_client: ^2.8.1
  # Kamera cevirme (on/arka) icin Helper.switchCamera — livekit ile AYNI surum (cakisma olmasin)
  flutter_webrtc: 1.4.0
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  # Arama sesleri: zil (gelen) + calma tonu (giden). flutter_ringtone_player KULLANMA —
  # iOS'ta dongu yok, stop() calismiyor.
  audioplayers: ^6.5.0
  vibration: ^3.1.3
  # Kilit ekraninda/uygulama kapaliyken gelen arama (iOS CallKit + Android full-screen intent)
  flutter_callkit_incoming: ^3.1.3
  battery_plus: ^7.1.1

  # ⚠️⚠️ TURU 74 — MEDYA MESAJLASMA (arastirma: docs/medya-arastirma/kesif-flutter-paketler.md)
  # Galeri/kamera secici. ⚠️ `camera` paketi EKLENMEDI: iOS'ta flutter_webrtc TEK
  # PAYLASILAN `videoCapturer` tutuyor (turu 50'de iki capture oturumu birbirini
  # oldurmustu). Sistem picker'i AYRI SUREC oldugu icin bu catismayi yasamaz.
  image_picker: ^1.2.3
  # Sikistirma + EXIF temizleme (platform API, saf Dart 'image' paketinden ~10x hizli)
  flutter_image_compress: ^2.5.1
  # Gecici dosya dizinleri (sikistirma cikti yolu, indirme onbellegi)
  path_provider: ^2.1.6
  # MD5/SHA-256 — yukleme butunlugu (Content-MD5 imzaya dahil) + dedup
  crypto: ^3.0.6
  # Uzak gorsel onbellegi. ⚠️ Bizde URL KISA OMURLU (600sn imzali) oldugu icin
  # onbellek anahtari URL DEGIL `media_id` olmali — bkz. medya_servisi.dart.
  cached_network_image: ^3.4.1
  # Ses notu kaydi. ⚠️ Yeni IZIN GEREKMEZ: RECORD_AUDIO (AndroidManifest) ve
  # NSMicrophoneUsageDescription (Info.plist) arama icin ZATEN var.
  record: ^7.1.1

  # TURU 75 — GONDERI/REELS VIDEO OYNATICI.
  # !! iOS TUZAGI: video_player varsayilan olarak AVAudioSession kategorisini
  #    .playback yapar ve DIGER sesi KESER -> suren LiveKit aramasinin sesi olur.
  #    Bu yuzden HER oynatici VideoPlayerOptions(mixWithOthers: true) ile kurulur
  #    ve arama/oda/yayin canliyken ses ZORLA kapatilir (bkz. sosyal/medya_video.dart).
  video_player: ^2.9.2

  # TURU 76 — sohbet listesinde KAYDIRMA aksiyonlari (sil/arsivle/sabitle).
  # Uygulamada daha once HICBIR swipe widget'i yoktu (Dismissible/Slidable 0 kullanim).
  # !! Dismissible YERINE flutter_slidable: Dismissible ogeyi AGACTAN SILER ve
  #    "arsivle" gibi GERI ALINABILIR islemlerde satiri geri getirmek icin ek
  #    durum yonetimi gerektirir; Slidable panel acar, satir yerinde kalir.
  flutter_slidable: ^4.0.3

  # TURU 81 — KONUM PAYLASMA.
  # ⚠️ `location` mesaj tipi DB CHECK'inde ve sunucu beyaz listesinde ZATEN
  #    kabul ediliyordu, sohbet listesi onizlemesi bile "Konum" cizyordu —
  #    ama konum ALAN hicbir paket ve GONDEREN hicbir yol yoktu ("olu ozellik"
  #    sinifinin SEKIZINCI ornegi).
  # ⚠️ IZIN `permission_handler` ile isteniyor (geolocator'in kendi izin API'si
  #    DEGIL): kod tabaninin geri kalani (mikrofon, kamera, telefon) o paketi
  #    kullaniyor ve iki izin katmani tutmak kacinilmaz olarak DRIFT ederdi.
  geolocator: ^13.0.2

  # ⚠️⚠️⚠️ TURU 87 — ADRES -> KOORDINAT (kullanici emri: *"isletmeler
  #    adreslerinde yer isaretlemesi gerekiyor"*).
  #
  #    Turu 85'te isletmenin haritada gorunmesi icin sahibinin ya dukkaninda
  #    "Bulundugum konumu kullan"a basmasi ya da koordinati ELLE yazmasi
  #    gerekiyordu. Ikisi de yapilmayinca isletme "Yakinimda"da **HIC
  #    GORUNMUYORDU** — oysa adresini ZATEN yazmisti.
  #
  # ⚠️ Bu paket **API ANAHTARI GEREKTIRMEZ**: Android'de `Geocoder`, iOS'ta
  #    `CLGeocoder` yani ISLETIM SISTEMININ kendi servisini kullanir.
  #    Google Geocoding API SECILMEDI — ayri bir uc, ayri faturalandirma ve
  #    (Maps'e kisitli olan) anahtarimizin kapsami disinda kalirdi.
  # ⚠️ Coozumleme AGA baglidir ve BASARISIZ OLABILIR; cagiran taraf bunu
  #    hata degil "koordinat bulunamadi" olarak ele alir (elle giris durur).
  geocoding: ^5.0.0

  # ⚠️⚠️ TURU 85 — HARITA SDK'si ARTIK EKLENDI ("Yakinimda" ekrani icin).
  #    Onceki karar (eklenmedi) su gerekcelere dayaniyordu ve UCU DE COZULDU:
  #      (a) "cloudMapId KULLANMA" -> kullanilmiyor; stil YEREL JSON olarak
  #          veriliyor (ucretsiz) ve Uber tarzi acik-gri gorunumu o veriyor.
  #      (b) "API anahtari + faturalandirma" -> `gebzem-app` projesinde
  #          faturalandirma ZATEN ACIKTI; Maps SDK (Android+iOS) etkinlestirildi
  #          ve YALNIZ Maps'e kisitli ayri bir anahtar uretildi.
  #      (c) "konum GOSTERMEK icin harita gerekmez" -> SOHBET icin hala dogru
  #          (orada "Haritada ac" kullaniliyor). Ama "Yakinimda" TANIMI GEREGI
  #          bir haritadir; liste tek basina o urunu vermez.
  #
  # ⚠️⚠️ ANAHTAR REPODA DEGIL: repo PUBLIC. Anahtar CI'da `MAPS_API_KEY`
  #    secret'indan DERLEME ANINDA enjekte edilir (Android: manifestPlaceholder,
  #    iOS: Info.plist). Anahtar bos olursa harita YERINE yer tutucu cizilir —
  #    yani yerel `flutter run` bozulmaz, sadece karo katmani gorunmez.
  # ⚠️ YAPMA: anahtari AndroidManifest/AppDelegate icine ELLE yazma.
  google_maps_flutter: ^2.9.0

  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Uygulama ikonu uretimi (calisma zamaninda kullanilmaz):
  # tool/ikon_uret.dart kaynak gorseli kirpar -> dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4
  image: ^4.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/sounds/
    # ⚠️⚠️ TURU 116 — UYGULAMA ICI LOGO: alt menunun ortasindaki daire
    #    (`lib/features/home/alt_menu.dart` -> `_logo`).
    #    Degistirmek icin: `dart run tool/logo_uret.dart <kaynak>`
    #    (arac kenar dolgusunu OLCER ve sozlesme bozuksa dosyayi YAZMAZ).
    #    Muhafiz: `test/logo_varlik_test.dart`.
    #    ⚠️ Bu, uygulama IKONU DEGILDIR (o `tool/ikon_uret.dart` +
    #       `flutter_launcher_icons`, asagida).
    #    ⚠️ Eski serh "TURU 83 - HEADER LOGOSU" diyordu; logo turu 98f'de
    #       header'dan CIKARILDI (bkz. `akis_ekrani.dart`).
    #
    # ⚠️⚠️⚠️ **KLASOR DEGIL TEK DOSYA** (turu 116 denetimi, OLCULDU).
    #    Eski hali `- assets/icon/` idi; Flutter o klasordeki HER dosyayi
    #    pakete gomer. Klasorde dort tane DERLEME-ZAMANI girdisi daha var
    #    (`icon.png` 631.844 + `icon-adaptive-fg.png` 403.131 +
    #    `web-512.png` 217.332 + `kaynak.jpg` 81.082 = **1.333.389 B**)
    #    ve bunlarin HICBIRI calisma aninda okunmuyor:
    #    `lib/` genelinde tek `AssetImage` -> `assets/icon/logo.png`.
    #    Sevk edilen APK'da bu dosyalar **`Stored` (%0 sikistirma)** ile
    #    duruyordu, yani maliyet ham boyutun TAMAMI: APK'nin ~%1,1'i,
    #    **IPA'nin ~%4,2'si**.
    #    ⚠️ RISK YOK: `flutter_launcher_icons` ve `tool/*.dart` bu
    #       dosyalari `dart:io File` ile DISKTEN okur, pakete bakmaz.
    #    ⚠️ YAPMA: tekrar `- assets/icon/` yapma; yeni bir varlik
    #       gerekiyorsa DOSYA OLARAK ekle.
    - assets/icon/logo.png
    # ⚠️⚠️⚠️ TURU 140 — **ORNEK YEMEK ISLETMELERININ MARKA GORSELLERI**
    #    (kullanici emri: *"yemek ornek olarak McDonald's, Burger King,
    #    Domino's Pizza, Popeyes olsun, ben logolari klasore koyacagim"*
    #    + *"gbz klasorunun icinde menu klasorunde logo ve resimler,
    #    oradaki menuleri diger isletmelerde menu resmi olarak
    #    koyabilirsin"*). Kaynak: proje kokundeki `menu/` klasoru.
    #
    # ⚠️⚠️ **KLASOR DEGIL TEK DOSYA** (turu 116 dersi, yukarida olculdu):
    #    `- assets/marka/` yazilsaydi klasore sonradan atilan HER dosya
    #    pakete girerdi. Toplam **280 KB**; hepsi calisma aninda okunuyor.
    # ⚠️ Bunlar YALNIZ `demo-` onekli ORNEK kayitlarda cizilir
    #    (`yakinimda_ekrani.dart` -> `_ornekLogo` / `_ornekMenu`).
    #    Gercek isletmenin gorseli SUNUCUDAN gelir (`media_assets`).
    # ⚠️ **POPEYES LOGOSU YOK** — kullanici klasore koymadi. O kayit
    #    logosuz cizilir (kategori ikonuna duser); sahte bir logo
    #    URETILMEDI. Dosya gelince buraya bir satir eklenir.
    - assets/marka/mcdonalds.jpg
    - assets/marka/burgerking.png
    - assets/marka/dominos.png
    # TURU 143 — dort McDonald's menu fotografi (menu_*.png, ~170 KB) artik
    # KODDA HICBIR YERDEN OKUNMUYOR (kullanici: "menulerde resimleri kaldir")
    # ve pakete girmemesi icin BURADAN CIKARILDI (turu 116b: olu varlik ham
    # boyutunun TAMAMI kadar yer kaplar). Dosyalar assets/marka altinda ve
    # git'te DURUYOR; geri istenirse asagiya birer satir yeter.
    # ⚠️⚠️ TURU 135 — `assets/vitrin/re1.jpg` (156.911 B) **PAKETTEN CIKTI**:
    #    tek okuyucusu menudeki uydurma mac karti ve onun detay ekraniydi,
    #    ikisi de kullanici emriyle SILINDI. Varlik pakette birakilsaydi
    #    hicbir yerden okunmayan 157 KB tasinirdi (turu 116b dersi: eldeki
    #    sevk edilen dosyalar `Stored` ile duruyor, maliyet HAM boyut).
    #    ⚠️ Dosyanin kendisi de silindi; gerekirse git gecmisinde.

  # TEST TURU 58 — UYGULAMA YAZI TIPI: GOOGLE SANS (kullanici istegi).
  # NOT: Google Sans uzun sure yalniz Google urunlerine ozeldi; ARTIK Google Fonts'ta
  # halka acik (fonts.google.com/specimen/Google+Sans). Dosyalar resmi Google Fonts
  # API'sinden (fonts.gstatic.com) alindi.
  # ⚠️ YAPMA: bu dosyalari elle/baska kaynaktan degistirme; guncelleme gerekirse
  # `https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700`
  # cikitisindaki gstatic adreslerinden yeniden indir.
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-400.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-500.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-600.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-700.ttf
          weight: 700

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ⚠️⚠️⚠️ TURU 120 — UYGULAMA IKONU **YENI LOGODAN** URETILIYOR (kullanici
#	emri: *"uygulama logosu telefondan, onu da yeni uygulama logosu ile
#	degistir"*).
#
# Kaynak artik `assets/icon/logo.png` (uygulama ici logoyla AYNI DOSYA) —
# eski `kaynak.jpg` KULLANILMIYOR; iki farkli marka gorseli tasiyorduk.
# Uretim:  dart run tool/ikon_uret.dart   ->   dart run flutter_launcher_icons
# ⚠️ `ikon_uret.dart` FAIL-CLOSED: kaynak daire degilse / ok ayristirilamazsa
#    HICBIR DOSYA YAZMAZ (bkz. o dosyanin serhi).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  # ⚠️ `icon.png` ZATEN %100 opak (dairenin ic teget karesi), yani bu renk
  #    pratikte kullanilmaz. Yine de ACIKCA yazilir: verilmezse
  #    `remove_alpha_ios` saydam pikselleri **BEYAZLA** doldurur ve ileride
  #    kaynak degisirse ikonun kenarlarinda beyaz halka cikardi.
  background_color_ios: "#6C2BD9"
  # ⚠️⚠️ ARKA KATMAN ARTIK **GORSEL** (duz renk degil): logonun kendi mor
  #	gradyani. Duz `#000000` iken launcher maskesi ne olursa olsun
  #	gradyanli daire SIYAH bir kare icinde "cikartma" gibi duruyordu.
  adaptive_icon_background: "assets/icon/icon-adaptive-bg.png"
  adaptive_icon_foreground: "assets/icon/icon-adaptive-fg.png"
  # ⚠️⚠️⚠️ **0 ZORUNLU.** Varsayilan 16, `mipmap-anydpi-v26/ic_launcher.xml`
  #	icine `<inset android:inset="16%">` yaziyordu ve bu, bizim ZATEN
  #	hesapladigimiz guvenli-bolge oraninin (%40) USTUNE ikinci bir
  #	kucultme uyguluyordu: ok kanvasin %40 x 0.68 = **%27**'sine dusuyor,
  #	ana ekranda minicik gorunuyordu. (18 Tem'den beri sessizce boyleydi.)
  adaptive_icon_foreground_inset: 0
