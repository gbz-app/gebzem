name: Android APK

on:
  workflow_dispatch: # elle tetiklenir (API'den de)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Imzalama anahtari
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.GEBZEM_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.GEBZEM_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.GEBZEM_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > gebzem-release.jks
          ls -l gebzem-release.jks
          # dogrula: keystore gecerli mi
          keytool -list -keystore gebzem-release.jks -storepass "$KEYSTORE_PASS" | head -3
          cat > key.properties <<EOF
          storeFile=gebzem-release.jks
          storePassword=$KEYSTORE_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASS
          EOF

      - name: Bagimliliklar
        working-directory: mobile
        run: flutter pub get

      - name: APK derle
        working-directory: mobile
        # ⚠️ TURU 85 — MAPS_API_KEY ortam degiskeni olarak gecer;
        #    `android/app/build.gradle.kts` onu manifestPlaceholder yapar ve
        #    AndroidManifest'teki ${MAPS_API_KEY} doldurulur.
        #    Repo PUBLIC oldugu icin anahtar KAYNAK KODA yazilamaz.
        # ⚠️ Secret tanimli degilse bos gecer: harita yer tutucuya duser,
        #    derleme BOZULMAZ.
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # HARITA=1 YALNIZ anahtar varsa: yoksa istemci haritayi HIC kurmaz
          # ve bozuk gri kutu yerine durust yer tutucu cizer.
          EK=""
          [ -n "$MAPS_API_KEY" ] && EK="--dart-define=HARITA=true"
          flutter build apk --release --build-number=${GITHUB_RUN_NUMBER} --build-name=1.0.${GITHUB_RUN_NUMBER} --dart-define=API_URL=https://api.gebzem.app $EK

      - uses: actions/upload-artifact@v4
        with:
          name: gebzem-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
