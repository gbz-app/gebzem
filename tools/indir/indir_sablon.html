<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0F">
<!-- ⚠️ Sunucu basligini soyan uygulama-ici tarayicilara karsi EK katman.
     Sunucu tarafindaki `no-store` YERINE GECMEZ, ona EKLENIR. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- ⚠️ Saat BASLIKTA da yazar: tarayici sekmesi, gecmis ve paylas menusu. -->
<title>Gebzem {{SAAT}} — indir</title>
<style>
/* ⚠️⚠️⚠️ TURU 134 — SAYFA SIFIRDAN SADELESTIRILDI (kullanici emri:
     *"aciklama yazma, indir sayfasini daha modern TEK SAYFA haline getir,
     aciklama vb LOGO GEREK YOK, surum numarasi + saati + indirme linkleri
     YETERLI"*).
   KALDIRILANLAR: logo · "Bu surumde" notlari · ozellik listeleri · SSS ·
   kurulum anlatimi · alt bilgi metinleri.
   ⚠️⚠️ KALANLAR TESADUF DEGIL: surum etiketi, SAAT (kullanici YEDI TURDUR
     "goremiyorum" dedi) ve iki indirme baglantisi. Nobetciler de KALDI —
     onlar metin degil, sayfanin KENDINI DOGRULAMA mekanizmasi.
   ⚠️ YAPMA: `body`ye `display:flex; align-items:center` koyma. Turu 50'de
      olculdu: kart ekrandan uzun oldugunda UST TASMA KAYDIRILAMAZ ve saat
      kirpilir. Ortalama `padding` + `margin:auto` ile yapilir. */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  padding:28px 20px 40px;
  min-height:100vh;
  background:#0B0B0F;
  color:#F5F5F7;
  font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
       "Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.sar{max-width:440px;margin:0 auto}

/* --- BAYAT SAYFA SERIDI (nobetciler acar) --- */
#bayat{
  display:none;background:#C0392B;color:#fff;
  padding:12px 14px;border-radius:14px;margin-bottom:18px;
  font-size:14px;line-height:1.45;
}
#bayat a{color:#fff}

/* --- SAAT: SAYFANIN ANA OGESI --- */
.saatkutu{
  background:linear-gradient(135deg,#7B3FE4 0%,#3B1E7A 100%);
  border-radius:22px;padding:22px 20px;text-align:center;
}
.etiket{
  margin:0;font-size:12px;font-weight:700;color:rgba(255,255,255,.72);
  text-transform:uppercase;
}
.buyuksaat{
  margin:6px 0 0;font-size:30px;font-weight:800;line-height:1.15;color:#fff;
  word-break:break-word;
}
.surum{
  margin:10px 0 0;font-size:13px;font-weight:600;
  color:rgba(255,255,255,.78);font-variant-numeric:tabular-nums;
}
.canli{
  margin:4px 0 0;font-size:12px;color:rgba(255,255,255,.6);
  font-variant-numeric:tabular-nums;
}

/* --- INDIRME --- */
.indir{margin-top:18px;display:grid;gap:10px}
.btn{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px;border-radius:16px;text-decoration:none;
  font-size:16px;font-weight:700;
  background:#17171C;color:#F5F5F7;border:1px solid #26262E;
}
.btn:active{background:#1F1F26}
.btn .sag{font-size:12px;font-weight:600;color:#9A9AA5;text-align:right}
.btn.ios{background:#F5F5F7;color:#0B0B0F;border-color:#F5F5F7}
.btn.ios .sag{color:#5B5B66}

.dip{
  margin:16px 0 0;text-align:center;font-size:12px;color:#7A7A85;
  font-variant-numeric:tabular-nums;
}
</style>
</head>
<body>
<div class="sar">

  <!-- ⚠️⚠️ BAYAT SAYFA SERIDI: sayfanin gomulu surumu, sunucudaki
       `surum.json` ile ya da adresteki `?v=` ile UYUSMAZSA acilir.
       ⚠️ YAPMA: bu dugumu silme — iki nobetci de onu yaziyor. -->
  <div id="bayat"></div>

  <div class="saatkutu">
    <p class="etiket">BU SÜRÜM</p>
    <!-- ⚠️⚠️ `.saatyaz` sinifi TASIYAN HER OGE `surum.json`dan gelen taze
         saatle yeniden yazilir. Bir ogeden dusurulurse o oge bayat govdede
         ESKI saati gostermeye devam eder ve sayfada IKI FARKLI saat olur —
         hic saat gostermemekten DAHA KOTU (turu 126 dersi). -->
    <p class="buyuksaat saatyaz" id="surumsaat">{{SAAT}}</p>
    <p class="surum">{{SURUM}}</p>
    <!-- ⚠️ CANLI SAAT: saniyesi akar. Sayfanin BAYAT OLMADIGINI kanitlayan
         tek gorsel isaret — ⚠️ YAPMA: kaldirma. -->
    <p class="canli">şu an <span id="ss">--:--:--</span></p>
  </div>

  <div class="indir">
    <!-- ⚠️ iOS ad-hoc kurulum `itms-services://` ile manifest uzerinden. -->
    <a class="btn ios" href="itms-services://?action=download-manifest&amp;url=https://indir.gebzem.app/manifest.plist">
      <span>iPhone'a Kur</span>
      <span class="sag saatyaz">{{SAAT}}</span>
    </a>
    <!-- ⚠️ `?v=` ZORUNLU: purge gecikse bile tarayici YENI dosyayi ceker. -->
    <a class="btn" href="https://indir.gebzem.app/gebzem.apk?v={{SURUM}}">
      <span>Android'e İndir</span>
      <span class="sag saatyaz">{{SAAT}}</span>
    </a>
  </div>

  <p class="dip">Gebzem · <span class="saatyaz">{{SAAT}}</span></p>
</div>

<script>
(function () {
  var buSurum = '{{SURUM}}';

  /* --- CANLI SAAT (UTC+3) --- */
  function tik() {
    var d = new Date(Date.now() + 3 * 3600 * 1000);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    var e = document.getElementById('ss');
    if (e) e.textContent = p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) +
      ':' + p(d.getUTCSeconds());
  }
  tik();
  setInterval(tik, 1000);

  /* ⚠️⚠️ NOBETCI 1 — AG GEREKTIRMEZ: adresteki `?v=` ile sayfaya GOMULU
     surum karsilastirilir. Bir webview `fetch`i hic tamamlamayabilir; bu
     blok yalnizca `location.search` okudugu icin DAIMA calisir.
     ⚠️ `?v=` YOKSA (ciplak adres) SESSIZ kalinir — yanlis alarm verilmez.
     ⚠️ YAPMA: bunu Nobetci 2'nin YERINE koyma; ikisi FARKLI arizalari
        yakalar (bu: eski baglantiyla acilmis sayfa · oteki: bayat GOVDE). */
  try {
    var m = /[?&]v=([^&#]+)/.exec(location.search);
    if (m && decodeURIComponent(m[1]) !== buSurum) {
      var u = document.getElementById('bayat');
      if (u) {
        u.style.display = 'block';
        u.innerHTML = 'BU SAYFA TARAYICI ÖNBELLEĞİNDEN GELDİ (' + buSurum + ').<br>' +
          'Açtığın adresteki sürüm: <b>' + decodeURIComponent(m[1]) + '</b> — ' +
          '<a href="/index.html?v=' + encodeURIComponent(m[1]) +
          '&r=' + Date.now() + '">SAYFAYI YENİLE</a>';
      }
    }
  } catch (e) {}

  /* ⚠️⚠️⚠️ NOBETCI 2 — **GORUNEN SAATI SUNUCUDAN YAZAR.**
     Kullanici YEDI TURDUR "saati goremiyorum" dedi ve sunucu HER SEFERINDE
     dogru cikti; geriye kalan tek aciklama TARAYICI/WEBVIEW ONBELLEGI.
     Onceki cozumler durumu yalniz HABER VERIYORDU (kirmizi serit) —
     kullanicidan hala bir DOKUNUS bekliyordu.
     ARTIK: `surum.json` `no-store` ile cekilir ve GORUNEN SAATIN KENDISI
     onunla degistirilir; govde onbellekten gelse bile kullanicinin OKUDUGU
     saat DOGRU olur.
     ⚠️ Yalniz `d.saat` doluysa yazilir (bos deger saati SILERDI).
     ⚠️ Kirmizi serit KALDIRILMADI: saat duzelse de kullanicinin ESKI bir
        APK baglantisina basmasi ihtimali surer. */
  try {
    fetch('/surum.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.v) return;
        if (d.saat) {
          var hepsi = document.querySelectorAll('.saatyaz');
          for (var i = 0; i < hepsi.length; i++) {
            if (hepsi[i].textContent !== d.saat) hepsi[i].textContent = d.saat;
          }
          document.title = 'Gebzem ' + d.saat + ' — indir';
        }
        if (d.v === buSurum) return;
        var s = document.getElementById('bayat');
        if (!s) return;
        s.style.display = 'block';
        s.innerHTML = 'BU SAYFA ESKİ (' + buSurum + ').<br>' +
          'Yeni sürüm: <b>' + d.v + '</b> — ' +
          '<a href="/index.html?v=' + d.v + '">YENİ SAYFAYI AÇ</a>';
      })
      .catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
