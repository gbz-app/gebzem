<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
<title>Telefon ile Giriş</title>
<style>
  /* ---------- Renk belirteçleri (açık tema) ---------- */
  :root{
    --zemin:#FFFFFF;
    --murekkep:#101317;
    --murekkep-soluk:#646B76;
    --cizgi:#E6E8EC;
    --alan:#F5F6F8;
    --alan-cizgi:#E1E4E9;
    --dugme:#101317;
    --dugme-yazi:#FFFFFF;
    --dugme-pasif:#EAECF0;
    --dugme-pasif-yazi:#A7ADB7;
    --odak:#101317;
    --cerceve:#FFFFFF;
    --golge:0 24px 60px rgba(16,19,23,.16), 0 2px 8px rgba(16,19,23,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--cerceve);
    color:var(--murekkep);
    font-family:'Google Sans','Segoe UI',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Sahne / telefon kabuğu ---------- */
  .sahne{min-height:100%;display:flex;align-items:stretch;justify-content:center}
  .telefon{
    width:100%;
    background:var(--zemin);
    display:flex;flex-direction:column;
  }
  @media (min-width:560px) and (min-height:720px){
    .sahne{align-items:center}
    .telefon{
      width:390px;height:812px;flex:none;
      border-radius:46px;overflow:hidden;
      border:1px solid var(--cizgi);
      box-shadow:var(--golge);
    }
  }

  /* ---------- Ekran ---------- */
  .ekran{
    flex:1;min-height:0;display:flex;flex-direction:column;
    padding:0 24px 28px;
    overflow-y:auto;overscroll-behavior:contain;
  }
  .ust-bosluk{height:20px;flex:none}

  /* ---------- Başlık: üstte ince, altta kalın ---------- */
  .baslik{display:flex;flex-direction:column;gap:2px}
  .baslik .ince{font-size:24px;line-height:1.32;font-weight:400;letter-spacing:-.2px}
  .baslik .kalin{font-size:24px;line-height:1.32;font-weight:700;letter-spacing:-.4px;text-wrap:balance}

  /* ---------- Telefon numarası alanı ---------- */
  .numara{
    margin-top:32px;flex:none;
    display:flex;align-items:stretch;
    height:58px;
    background:var(--alan);
    border:1.5px solid var(--alan-cizgi);
    border-radius:16px;
    transition:border-color .16s ease, background-color .16s ease;
  }
  .numara:focus-within{border-color:var(--odak);background:var(--zemin)}

  .ulke{
    display:flex;align-items:center;gap:4px;
    padding:0 14px 0 16px;
    background:none;border:0;cursor:pointer;
    font-family:inherit;font-size:17px;font-weight:500;
    color:var(--murekkep);
    border-radius:15px 0 0 15px;
  }
  .ulke svg{width:18px;height:18px;color:var(--murekkep-soluk);margin-top:1px}

  .ayirac{width:1.5px;background:var(--alan-cizgi);margin:12px 0;flex:none}

  #tel{
    flex:1;min-width:0;
    background:none;border:0;outline:0;
    padding:0 16px;
    font-family:inherit;font-size:17px;font-weight:500;
    letter-spacing:.3px;
    color:var(--murekkep);
  }
  #tel::placeholder{color:var(--murekkep-soluk);font-weight:400;letter-spacing:.3px}

  /* ---------- Boşluk + devam düğmesi ---------- */
  .esnek{flex:1;min-height:24px}

  /* Klavye acilinca sarmal yukari otelenir. transform YERLESIMI DEGISTIRMEZ,
     GPU'da calisir -> ziplama yok, gecis puruzsuz. Basma efekti (scale)
     butonun KENDISINDE kaldigi icin iki transform CAKISMAZ. */
  .devam-sarmal{
    flex:none;
    transition:transform .28s cubic-bezier(.22,.61,.36,1);
    will-change:transform;
  }

  .devam{
    flex:none;
    height:56px;width:100%;
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--dugme);color:var(--dugme-yazi);
    border:0;border-radius:16px;cursor:pointer;
    font-family:inherit;font-size:16.5px;font-weight:700;letter-spacing:-.1px;
    transition:background-color .16s ease, color .16s ease, transform .1s ease;
  }
  .devam svg{width:19px;height:19px}
  .devam:disabled{background:var(--dugme-pasif);color:var(--dugme-pasif-yazi);cursor:default}
  .devam:not(:disabled):active{transform:scale(.985)}

  /* GECICI: klavye olcumu — dogrulandiktan sonra KALDIRILACAK */
  .olcum{
    position:fixed;top:0;left:0;right:0;z-index:99;
    font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;
    background:#101317;color:#6EE7A8;
    padding:5px 8px;padding-top:calc(5px + env(safe-area-inset-top,0px));
    white-space:pre-wrap;word-break:break-all;
  }

  :focus-visible{outline:2px solid var(--odak);outline-offset:3px;border-radius:12px}

  @media (prefers-reduced-motion: reduce){
    *{transition:none!important}
  }
</style>

<div class="olcum" id="olcum">ölçüm bekleniyor…</div>

<div class="sahne">
  <div class="telefon">
    <div class="ekran">
      <div class="ust-bosluk"></div>

      <h1 class="baslik">
        <span class="ince">Başlamak için</span>
        <span class="kalin">Telefon numaranı gir</span>
      </h1>

      <div class="numara">
        <button class="ulke" type="button" aria-label="Ülke kodu: Türkiye, +90">
          +90
          <!-- lucide: chevron-down -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <span class="ayirac"></span>
        <input id="tel" type="tel" inputmode="numeric" autocomplete="tel-national"
               placeholder="5XX XXX XX XX" aria-label="Telefon numarası">
      </div>

      <div class="esnek"></div>

      <div class="devam-sarmal" id="sarmal">
      <button class="devam" id="devam" type="button" disabled>
        Devam et
        <!-- lucide: arrow-right -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
      </div>
    </div>
  </div>
</div>

<script>
  var tel = document.getElementById('tel');
  var devam  = document.getElementById('devam');
  var sarmal = document.getElementById('sarmal');
  var olcum  = document.getElementById('olcum');

  function bicimle(ham){
    var d = ham.replace(/\D/g,'').slice(0,10);
    var p = [d.slice(0,3), d.slice(3,6), d.slice(6,8), d.slice(8,10)];
    return p.filter(function(x){ return x.length; }).join(' ');
  }

  tel.addEventListener('input', function(){
    var sondaMi = tel.selectionStart === tel.value.length;
    var d = tel.value.replace(/\D/g,'').slice(0,10);
    tel.value = bicimle(tel.value);
    if (sondaMi) { tel.setSelectionRange(tel.value.length, tel.value.length); }
    devam.disabled = d.length !== 10;
  });

  devam.addEventListener('click', function(){
    if (devam.disabled) return;
    devam.textContent = 'Kod gönderiliyor…';
  });
  /* ================== KLAVYE ==================
     Hedef: buton klavyenin 10px ustunde dursun, ziplamadan, iki yonde de
     animasyonlu. Bunun icin klavye YUKSEKLIGI lazim. Uc kaynak sirayla
     denenir; hangisi calisirsa `kaynak` onu yazar (ust seritte gorunur). */
  var KLAVYE_PAY = 10;   /* klavyeyle buton arasi */
  var ALT_DOLGU  = 28;   /* .ekran'in alt dolgusu */
  var acilisBoy  = window.innerHeight;
  var kaynak = '-';

  function klavyeBoyu(){
    var g = window.visualViewport;
    if (g){
      var f = Math.round(window.innerHeight - g.height - g.offsetTop);
      if (f > 80){ kaynak = 'visualViewport'; return f; }
    }
    var sk = navigator.virtualKeyboard;
    if (sk && sk.boundingRect && sk.boundingRect.height > 80){
      kaynak = 'virtualKeyboard'; return Math.round(sk.boundingRect.height);
    }
    var f2 = Math.round(acilisBoy - window.innerHeight);  /* iframe kucululduyse */
    if (f2 > 80){ kaynak = 'innerHeight'; return f2; }
    kaynak = 'YOK';
    return 0;
  }

  function konumla(){
    var kb = klavyeBoyu();
    var kaydir = kb > 0 ? Math.max(0, kb + KLAVYE_PAY - ALT_DOLGU) : 0;
    sarmal.style.transform = 'translateY(-' + kaydir + 'px)';
    olcumYaz(kb, kaydir);
  }

  /* GECICI olcum satiri — dogrulaninca kaldirilacak */
  function olcumYaz(kb, kaydir){
    if (!olcum) return;
    var g = window.visualViewport;
    olcum.textContent =
      'inner=' + window.innerHeight +
      '  vv=' + (g ? Math.round(g.height) : 'yok') +
      '  off=' + (g ? Math.round(g.offsetTop) : '-') +
      '  acilis=' + acilisBoy +
      '\n' +
      'KLAVYE=' + kb + '  kaydir=' + kaydir + '  kaynak=' + kaynak +
      '  vk=' + (navigator.virtualKeyboard ? 'var' : 'yok');
  }

  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', konumla);
    window.visualViewport.addEventListener('scroll', konumla);
  }
  window.addEventListener('resize', konumla);
  if (navigator.virtualKeyboard){
    try {
      navigator.virtualKeyboard.overlaysContent = true;
      navigator.virtualKeyboard.addEventListener('geometrychange', konumla);
    } catch(e){}
  }
  /* Klavye animasyonu bitmeden olcum yanlis gelir -> birkac kez orneklenir */
  function gecikmeliOlc(){ [60,180,340,520].forEach(function(ms){ setTimeout(konumla, ms); }); }
  tel.addEventListener('focus', gecikmeliOlc);
  tel.addEventListener('blur',  gecikmeliOlc);

  konumla();
</script>
